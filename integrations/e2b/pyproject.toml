[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-env-e2b"
version = "0.1.0"
description = "The E2B Sandbox classes on Agent Substrate environments (ate-env)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"  # what e2b requires
# ate-env-rl is this repo's Python client (clients/python); if not yet on
# PyPI, install it from the checkout first: pip install ./clients/python
# e2b is held to one major. The classes override public names of the SDK only,
# refuse each public method and each argument that they do not map (also one
# that a newer 2.x adds), and give the SDK object no API key and an API
# address that does not resolve: a newer 2.x can break a mapped call, and
# cannot make the classes call E2B. tests/test_surface.py holds the structure.
dependencies = [
  "ate-env-rl",
  "e2b>=2.64.0,<3",
  # Imported by the package itself; e2b and ate-env-rl hold their versions.
  "grpcio",
  "httpx",
  "packaging",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1.5.0"]  # pytest-asyncio: the async tests

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ate-env-rl = { workspace = true }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The same rules as clients/python.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
