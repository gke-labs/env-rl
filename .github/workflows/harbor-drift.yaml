# The Harbor provider on the newest Harbor that its bounds allow, which
# uv.lock does not hold (docs/plans/harbor, HB-29; the lock is HB-27): the
# tests of integrations/harbor in an environment outside the uv workspace.
# On a pull request that changes the provider, the Python client, the script
# or this workflow, weekly, and on demand. It is not a required check: a new
# upstream release must not fail an unrelated change. A failed run names the
# Harbor version; the fix is a change to the provider or to the bounds in
# integrations/harbor/pyproject.toml. Actions are pinned by commit SHA
# (version in the trailing comment), as the organization's workflow security
# scan requires.
name: harbor-drift

on:
  pull_request:
    paths:
      - .github/workflows/harbor-drift.yaml
      - hack/ci/harbor-drift.sh
      - integrations/harbor/**
      - clients/python/**
  schedule:
    # Weekly on Monday at 07:30 UTC, after e2b-drift.
    - cron: "30 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  newest-harbor:
    name: Harbor provider on the newest Harbor
    runs-on: ubuntu-24.04 # pinned on purpose: ubuntu-latest now resolves to 26.04; bump deliberately
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the Harbor tests on the newest Harbor
        run: hack/ci/harbor-drift.sh
